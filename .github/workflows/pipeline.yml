name: Update PR Dashboard

# Manual trigger only for now. Fetch, clean, and build have all been
# verified against a real downloaded IRCC file, but this exact workflow
# hasn't had a live run in GitHub Actions yet (this session's network
# policy can't reach ircc.canada.ca to test the fetch step end-to-end).
# Once a manual run (Actions tab -> Run workflow) succeeds, add a
# `schedule:` trigger here (e.g. weekly) so it checks for updates on its
# own — IRCC's exact monthly publish day isn't confirmed, so a weekly
# check is a safe way to catch updates without needing to know it.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest IRCC data
        run: python scripts/fetch_ircc_data.py

      - name: Clean raw data
        run: python scripts/clean_ircc_data.py

      - name: Build dashboard
        run: python scripts/ircc_dashboard_pr_by_country.py data/clean/pr_citz_long_clean.csv --output_dir output

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clean
          git diff --cached --quiet || git commit -m "Update cleaned PR data [automated]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
